fragment ProductFields on Product {
    createdAt
    descriptionHtml
    handle
    id
    mediaCount {
        count
    }
    media (first: 20) {
        edges {
           cursor
            node {
                ...MediaFields
            }
        }
    }
    options {
        name
        position
        values
    }
    productType
    status
    tags
    title
    updatedAt
    variantsCount {
        count
    }
    vendor
}